current_range:
  max: 10mA
  min: 100nA
  start: 10uA
cycles: 3
data_processing:
  min_height: 0.0
  min_width: 0.1
  smooth_level: 0
general:
  notes: ''
  power_frequency: 50
  save_on_internal_storage: false
  use_hardware_sync: false
id: mm
interval_time: 0.02
post_measurement:
  cell_on_after_measurement: true
  standby_potential: 0.4
  standby_time: 0.0
pretreatment:
  conditioning_potential: 0.3
  conditioning_time: 1.0
  deposition_potential: -0.2
  deposition_time: 2.0
stages:
- current_limits:
    max: 10.0
    min: -2.5
  measurement_triggers:
    d0: false
    d1: false
    d2: false
    d3: false
  potential: 0.5
  run_time: 0.1
  stage_type: ConstantE
- applied_current_range: 10mA
  current: -0.5
  measurement_triggers:
    d0: false
    d1: false
    d2: false
    d3: false
  potential_limits:
    max: 0.75
    min: null
  run_time: 0.1
  stage_type: ConstantI
- begin_potential: -0.5
  current_limits:
    max: 3.0
    min: null
  end_potential: 0.5
  measurement_triggers:
    d0: false
    d1: false
    d2: false
    d3: false
  scanrate: 20.0
  stage_type: SweepE
  step_potential: 0.25
- measurement_triggers:
    d0: false
    d1: false
    d2: false
    d3: false
  potential_limits:
    max: null
    min: 0.0
  run_time: 0.1
  stage_type: OpenCircuit
